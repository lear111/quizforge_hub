server.address=${HUB_JAVA_BIND:127.0.0.1}
server.port=${HUB_JAVA_PORT:4338}
server.error.include-message=never
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.web.resources.cache.cachecontrol.no-store=true
hub.data-dir=${HUB_JAVA_DATA_DIR:./data-java}
hub.cookie-name=${HUB_COOKIE_NAME:qfh_session}
hub.monthly-budget-bytes=${HUB_MONTHLY_BUDGET_BYTES:150000000000}
hub.ip-daily-budget-bytes=${HUB_IP_DAILY_BUDGET_BYTES:1048576000}
hub.time-zone=${BILLING_TIMEZONE:Asia/Shanghai}
hub.trust-proxy=${TRUST_PROXY:false}
hub.cloud-enabled=${CLOUD_ENABLED:false}
hub.local-import-enabled=${LOCAL_IMPORT_ENABLED:false}
hub.practice-origin=${PRACTICE_ORIGIN:}
hub.legacy-origin=${HUB_LEGACY_ORIGIN:}
spring.main.banner-mode=off
spring.servlet.multipart.resolve-lazily=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=40MB
spring.servlet.multipart.file-size-threshold=0
server.tomcat.max-part-count=20
server.tomcat.max-swallow-size=40MB
