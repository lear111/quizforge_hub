  <header class="site-header" id="siteHeader">
    <div class="container header-inner">
      <a class="brand" href="#" aria-label="QuizForge 首页">
        <div class="brand-mark"><svg class="icon" viewBox="0 0 32 32" aria-hidden="true"><circle cx="14.3" cy="13.6" r="9.5"/><path d="m20.9 20.9 7.2 7.2M10 13.3l3 3 5.6-6"/></svg></div>
        <div><div class="brand-name">QuizForge</div><div class="brand-caption">题库广场 · LEARN TOGETHER</div></div>
      </a>
      <nav class="main-nav" id="mainNav" aria-label="主导航">
        <a class="nav-link active" href="#discover" data-view="discover">发现题库</a>
        <a class="nav-link" href="#mine" data-view="mine">我的分享</a>
        <a class="nav-link" href="#download" data-view="download">下载软件</a>
        <a class="nav-link nav-mobile-only" href="#profile" data-view="profile">个人中心</a>
        <a class="nav-link nav-mobile-only" href="#" id="mobileAdminLink" hidden>管理后台</a>

      </nav>
      <div class="header-actions">
        <a href="#" class="small-link" id="adminLink" hidden>管理后台</a>
        <button class="practice-btn" data-demo="练习空间">练习空间</button>
        <button class="share-btn" id="shareBtn" data-goto="upload" aria-label="分享题库" title="分享题库"><svg class="icon"><use href="#i-plus"/></svg><span class="share-text">分享题库</span></button>
        <div class="user-chip" id="identity"><a class="user-link" href="#profile">用户中心</a></div>
        <button class="mobile-menu-btn" id="menuBtn" aria-label="展开导航" aria-expanded="false" aria-controls="mainNav"><svg class="icon"><use href="#i-menu"/></svg></button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero container" id="heroSection" aria-label="搜索题库">
      <h1 id="pageTitle">发现题库</h1>
      <form class="search-panel" id="searchForm" role="search">
        <svg class="icon search-icon"><use href="#i-search"/></svg>
        <input class="search-input" id="searchInput" type="search" autocomplete="off" placeholder="搜索题库名称或简介，例如：408、考研数学" aria-label="搜索题库" />
        <span class="kbd" aria-hidden="true">/</span>
        <button class="search-btn" type="submit">搜索</button>
      </form>
      <div class="quick-searches" id="quickSearches" hidden><span>热门搜索</span><button type="button" data-search="408">408 真题</button><button type="button" data-search="考研政治">考研政治</button><button type="button" data-search="考研数学">考研数学</button></div>
    </section>

    <section class="library container" id="library" aria-labelledby="libraryTitle">
      <div class="section-heading">
        <div class="heading-left"><h2 id="libraryTitle">公开题库</h2><div class="status-tabs" id="statusTabs" role="tablist" aria-label="按审核状态筛选" hidden></div></div>
        <div class="result-count" id="resultCount" role="status">正在读取题库…</div>
      </div>
      <div class="filters-row" id="discoveryFilters" hidden>
        <div class="category-pills" role="group" aria-label="学科分类" id="categoryPills" hidden>
          <button class="category-pill active" type="button" data-category="全部" aria-pressed="true">全部题库</button>
          <button class="category-pill" type="button" data-category="计算机" aria-pressed="false">计算机</button>
          <button class="category-pill" type="button" data-category="政治" aria-pressed="false">政治</button>
          <button class="category-pill" type="button" data-category="数学" aria-pressed="false">数学</button>
          <button class="category-pill" type="button" data-category="英语" aria-pressed="false">英语</button>
        </div>
        <div class="sort-wrap" id="sortWrap" hidden><span>排序</span><label class="select-shell"><select class="sort-select" id="sortSelect" aria-label="题库排序"><option value="recommended">推荐排序</option><option value="latest" selected>最近更新</option><option value="popular">下载最多</option><option value="title">题库名称</option></select></label></div>
      </div>
      <div class="library-grid" id="libraryGrid" aria-live="polite"></div>
      <div class="empty-state" id="emptyState" hidden><div class="empty-icon"><svg class="icon"><use href="#i-search"/></svg></div><h3 id="emptyTitle">暂时没有找到相关题库</h3><p id="emptyText">尝试更换关键词，或返回查看全部题库。</p><button class="reset-button" id="resetBtn" type="button">查看全部题库</button></div>
    </section>
    <section class="container up-view" id="uploadView" hidden aria-labelledby="upTitle"></section>
    <section class="container pf-view" id="profileView" hidden aria-labelledby="pfName"></section>
    <section class="container dl-view" id="downloadView" hidden aria-labelledby="dlTitle"></section>
    <section class="container detail-view" id="detailView" hidden aria-live="polite"></section>
  </main>
  <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-label="查看大图"><img id="lightboxImg" alt="" /></div>

  <footer class="site-footer"><div class="container footer-inner"><span class="footer-name">QuizForge</span></div></footer>
  <button class="fab" id="contactFab" type="button" data-tip="联系管理员" aria-label="联系管理员" data-admin-contact><svg class="icon" aria-hidden="true"><use href="#i-comment"></use></svg></button>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  </body></html>
