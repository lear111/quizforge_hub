# Template only: replace domain, certificate paths and confirm node path before use.
# Include inside nginx http context; do not copy over an existing nginx configuration.
limit_req_zone $binary_remote_addr zone=qfh_requests:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=qfh_login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=qfh_connections:10m;

server {
    listen 80;
    server_name hub.example.com;
    return 301 https://hub.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name hub.example.com;
    ssl_certificate /etc/letsencrypt/live/hub.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 39m;
    client_body_timeout 30s;
    limit_conn qfh_connections 8;
    limit_req_status 429;

    location / {
        limit_req zone=qfh_requests burst=20 nodelay;
        proxy_pass http://127.0.0.1:4318;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_cache off;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    location /api/auth/ {
        limit_req zone=qfh_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:4318;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_cache off;
    }
}
