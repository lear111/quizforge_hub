<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7856d3">
  <meta name="description" content="QuizForge 题库分享网站仍在完善中，请暂时前往网盘下载相关文件。">
  <title>QuizForge · 下载指引</title>
  <link rel="icon" type="image/png" href="/quizforge-icon.png">
  <link rel="stylesheet" href="/notice.css">
  <script src="/notice.js" defer></script>
</head>
<body>
  <header class="brand"><img src="/quizforge-icon.png" width="40" height="40" alt=""><span>QuizForge<small>题库分享</small></span></header>
  <main>
    <section class="notice" aria-labelledby="notice-title">
      <span class="status"><span></span>网站完善中</span>
      <div class="folder" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M7 16V12a3 3 0 0 1 3-3h10l5 6h13a3 3 0 0 1 3 3v18a3 3 0 0 1-3 3H10a3 3 0 0 1-3-3V16Z"/><path d="M24 20v12m-5-5 5 5 5-5"/></svg></div>
      <h1 id="notice-title">网站仍在完善中</h1>
      <p class="intro">题库分享网站暂未正式开放。<br>请先前往网盘，下载 QuizForge 相关文件。</p>
      <div class="download-card">
        <div class="file-heading"><span class="file-icon" aria-hidden="true">Q</span><div><h2>QuizForge</h2><p>{{PROVIDER}} · 共享文件夹</p></div></div>
        <a class="download" href="{{DOWNLOAD_URL}}" target="_blank" rel="noopener noreferrer">前往{{PROVIDER}}<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg></a>
        <div class="extraction"><span>提取码</span><code id="extraction-code">{{DOWNLOAD_CODE}}</code><button id="copy-code" type="button" aria-label="复制提取码">复制</button></div>
        <p class="copy-feedback" id="copy-feedback" aria-live="polite"></p>
      </div>
      <p class="thanks">感谢你的耐心等待。</p>
    </section>
  </main>
  <footer>QuizForge<span>下载指引</span></footer>
</body>
</html>
